services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GETWAY_DOWNLOAD_DIR: /tmp/getway-downloads
      GETWAY_MAX_CONCURRENT_DOWNLOADS: ${GETWAY_MAX_CONCURRENT_DOWNLOADS:-2}
      GETWAY_ALLOWED_ORIGINS: ${GETWAY_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    volumes:
      - getway_downloads:/tmp/getway-downloads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  getway_downloads:
