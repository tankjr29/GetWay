[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getway"
version = "0.1.0"
description = "Moteur de téléchargement vidéo modulaire avec CLI et API asynchrone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2026.1.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]
api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
getway = "getway.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/getway"]